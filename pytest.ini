[pytest]
minversion = 6.0
addopts = -q --strict-markers --cov=./ --cov-report=html:coverage_html --cov-report=term-missing --cov-fail-under=70
testpaths = tests
markers =
    integration: integration tests
    e2e: end-to-end tests
filterwarnings =
    ignore:.*TavilySearchResults.*
    ignore:.*websockets.legacy is deprecated.*:DeprecationWarning
    ignore::DeprecationWarning
