[pytest]
minversion = 6.0
addopts = -q --strict-markers --cov=agents --cov=orchestration --cov=resilience --cov=security --cov=tools --cov=utils --cov-report=html:coverage_html --cov-report=term-missing --cov-fail-under=100
testpaths = tests
markers =
    integration: integration tests
    e2e: end-to-end tests
filterwarnings =
    ignore:.*TavilySearchResults.*
    ignore:.*websockets.legacy is deprecated.*:DeprecationWarning
    ignore::DeprecationWarning
