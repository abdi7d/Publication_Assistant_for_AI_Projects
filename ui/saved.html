<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved - Publication Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body class="min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Saved Items</h1>
        <a href="index.html" class="px-3 py-2 bg-slate-800 rounded text-sm"
          >Back</a
        >
      </div>
      <div
        id="saved-list"
        class="bg-slate-900 p-6 rounded text-sm text-slate-200"
      >
        Loading...
      </div>
    </div>
    <script>
      const storedTheme = localStorage.getItem("theme");
      if (storedTheme === "light")
        document.documentElement.classList.remove("dark");
      else document.documentElement.classList.add("dark");

      async function loadSaved() {
        try {
          const res = await fetch("/api/saved");
          const j = await res.json();
          const el = document.getElementById("saved-list");
          const items = (j && j.items) || [];
          if (items.length === 0) {
            el.innerHTML = '<div class="text-slate-400">No saved items.</div>';
            return;
          }
          el.innerHTML = items
            .map(
              (it) =>
                `<div class="p-3 bg-slate-800 rounded mb-2"><div class=\"font-semibold\">${it.title || it.id}</div><div class=\"text-xs text-slate-400\">${it.summary || ""}</div></div>`,
            )
            .join("");
        } catch (e) {
          document.getElementById("saved-list").textContent =
            "Failed to load saved items";
        }
      }
      loadSaved();
    </script>
  </body>
</html>
