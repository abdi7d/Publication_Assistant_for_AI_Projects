<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <title>Help & Docs - Publication Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                navy: "#0f172a",
                sidebar: "#0b1120",
                card: "#1e293b",
                surface: "#111827",
                accent: "#6366f1",
                border: "#334155",
                muted: "#94a3b8",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #08111f;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .page-shell {
        position: relative;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          #08111f 0%,
          #0b132b 35%,
          #111827 100%
        );
      }
      #sidebar-root {
        height: 100vh;
        overflow: hidden;
      }
      #sidebar-root > * {
        height: 100vh;
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.14);
        backdrop-filter: blur(18px);
        box-shadow: 0 28px 80px -45px rgba(15, 23, 42, 0.85);
      }
      .soft-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        padding: 0.45rem 0.9rem;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #dbeafe;
      }
      .page-heading {
        margin-top: 0.9rem;
        font-size: clamp(2rem, 3vw, 2.8rem);
        font-weight: 700;
        letter-spacing: -0.055em;
        color: #f8fafc;
      }
    </style>
  </head>
  <body class="dark h-screen overflow-hidden">
    <div class="page-shell h-screen overflow-hidden">
      <div
        class="absolute inset-0 bg-gradient-to-br from-[#08111F] via-[#0B132B] to-[#111827]"
      ></div>
      <div class="absolute inset-0 opacity-75">
        <img
          src="/assets/hero_bg.png"
          alt="Background"
          class="h-full w-full object-cover object-center"
          loading="lazy"
        />
      </div>
      <div
        class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-950/45 to-transparent"
      ></div>
      <div
        class="relative z-10 mx-auto flex h-screen max-w-[1600px] flex-col lg:grid lg:grid-cols-[320px_minmax(0,1fr)]"
      >
        <div id="sidebar-root"></div>
        <!-- Theme Toggle Button -->
        <button
          data-theme-toggle
          onclick="ThemeManager.toggle()"
          class="fixed top-4 right-4 z-50 p-2 rounded-xl bg-slate-800/80 backdrop-blur-xl border border-slate-700 text-white hover:bg-slate-700 transition-all duration-200 hover:scale-105"
          aria-label="Toggle theme"
        >
          <span class="theme-icon">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </span>
        </button>
        <main
          class="flex h-screen flex-1 items-start justify-center overflow-y-auto px-4 py-6 sm:px-6 lg:px-8"
        >
          <div class="w-full max-w-5xl">
            <div class="glass-card rounded-[28px] p-4 sm:p-6 lg:p-8">
              <div class="mb-6 flex items-center justify-between gap-3">
                <div>
                  <div class="soft-badge">Help</div>
                  <h1 class="page-heading">Help & docs</h1>
                </div>
                <a
                  href="index.html"
                  class="rounded-full border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-200 transition hover:bg-white/10"
                  >Back</a
                >
              </div>
              <div
                id="help"
                class="rounded-3xl border border-white/10 bg-slate-950/60 p-4 text-sm text-slate-200"
              >
                Loading help...
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="/static/shared.js"></script>
    <script>
      async function load() {
        try {
          const res = await APIClient.get("/api/help");
          const el = document.getElementById("help");
          
          if (!res) {
            el.innerHTML = `
              <div class="flex flex-col items-center justify-center py-12 space-y-4">
                <div class="text-4xl">❓</div>
                <p class="text-slate-400">No help documentation available</p>
                <a href="generate.html" class="text-indigo-400 hover:text-indigo-300 transition-colors">
                  Start using the application →
                </a>
              </div>
            `;
            return;
          }
          
          // Format help content nicely
          let html = '<div class="space-y-6">';
          
          if (res.docs_url) {
            html += `
              <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700">
                <div class="font-semibold text-white mb-2">📚 Documentation</div>
                <a href="${res.docs_url}" target="_blank" class="text-indigo-400 hover:text-indigo-300 transition-colors">
                  ${res.docs_url}
                </a>
              </div>
            `;
          }
          
          if (res.contact) {
            html += `
              <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700">
                <div class="font-semibold text-white mb-2">📧 Contact</div>
                <div class="text-xs text-slate-400">${res.contact}</div>
              </div>
            `;
          }
          
          if (res.faq && res.faq.length > 0) {
            html += '<div class="space-y-3">';
            html += '<div class="font-semibold text-white mb-3">❓ Frequently Asked Questions</div>';
            res.faq.forEach((faq, index) => {
              html += `
                <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700">
                  <div class="font-medium text-white">${faq.question}</div>
                  <div class="text-xs text-slate-400 mt-2">${faq.answer}</div>
                </div>
              `;
            });
            html += '</div>';
          }
          
          html += '</div>';
          el.innerHTML = html;
        } catch (e) {
          document.getElementById("help").innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 space-y-4">
              <div class="text-4xl">⚠️</div>
              <p class="text-slate-400">Failed to load help</p>
              <button onclick="load()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors">
                Retry
              </button>
            </div>
          `;
          NotificationManager.show("Failed to load help", "error");
        }
      }
      load();
    </script>
    <script src="/static/sidebar-loader.js" defer></script>
  </body>
</html>
