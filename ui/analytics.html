<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <title>Analytics - Publication Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                navy: "#0f172a",
                sidebar: "#0b1120",
                card: "#1e293b",
                surface: "#111827",
                accent: "#6366f1",
                border: "#334155",
                muted: "#94a3b8",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #08111f;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .page-shell {
        position: relative;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          #08111f 0%,
          #0b132b 35%,
          #111827 100%
        );
      }
      #sidebar-root {
        height: 100vh;
        overflow: hidden;
      }
      #sidebar-root > * {
        height: 100vh;
      }
      .content-section {
        margin-bottom: 2rem;
      }
      .section-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }
      .section-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }
      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
      }
      .soft-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        padding: 0.45rem 0.9rem;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #dbeafe;
      }
      .page-heading {
        margin-top: 0.9rem;
        font-size: clamp(2rem, 3vw, 2.8rem);
        font-weight: 700;
        letter-spacing: -0.055em;
        color: #f8fafc;
      }
    </style>
  </head>
  <body class="dark h-screen overflow-hidden">
    <div class="page-shell h-screen overflow-hidden">
      <div
        class="absolute inset-0 bg-gradient-to-br from-[#08111F] via-[#0B132B] to-[#111827]"
      ></div>
      <div class="absolute inset-0 opacity-75">
        <img
          src="/assets/hero_bg.png"
          alt="Background"
          class="h-full w-full object-cover object-center"
          loading="lazy"
        />
      </div>
      <div
        class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-950/45 to-transparent"
      ></div>
      <div
        class="relative z-10 flex h-screen max-w-full"
      >
        <div id="sidebar-root"></div>
        <main
          class="flex-1 h-screen overflow-y-auto"
        >
          <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="mb-6 flex items-center justify-between gap-3">
              <div>
                <div class="soft-badge mb-3">Analytics</div>
                <h1 class="page-heading">Performance overview</h1>
              </div>
            </div>
            <div
              id="analytics"
              class="section-card text-sm text-slate-200"
            >
              <div style="height: 320px">
                <canvas id="analyticsChart"></canvas>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/shared.js"></script>
    <script>
      async function load() {
        try {
          const res = await APIClient.get("/api/analytics");
          const ctx = document.getElementById("analyticsChart").getContext("2d");
          new Chart(ctx, {
            type: "bar",
            data: {
              labels: ["Projects"],
              datasets: [
                {
                  label: "Count",
                  data: [res.projects_count || 0],
                  backgroundColor: ["#6366f1"],
                },
              ],
            },
            options: { 
              responsive: true, 
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: {
                    color: '#cbd5e1'
                  }
                }
              },
              scales: {
                y: {
                  ticks: {
                    color: '#94a3b8'
                  },
                  grid: {
                    color: 'rgba(148, 163, 184, 0.1)'
                  }
                },
                x: {
                  ticks: {
                    color: '#94a3b8'
                  },
                  grid: {
                    color: 'rgba(148, 163, 184, 0.1)'
                  }
                }
              }
            }
          });
        } catch (e) {
          document.getElementById("analytics").innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 space-y-4">
              <div class="text-4xl">📊</div>
              <p class="text-slate-400">Failed to load analytics</p>
              <button onclick="load()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors">
                Retry
              </button>
            </div>
          `;
          NotificationManager.show("Failed to load analytics", "error");
        }
      }
      load();
    </script>
    <script src="/static/sidebar-loader.js" defer></script>
  </body>
</html>
