<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <title>Projects - Publication Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                navy: "#0f172a",
                sidebar: "#0b1120",
                card: "#1e293b",
                surface: "#111827",
                accent: "#6366f1",
                border: "#334155",
                muted: "#94a3b8",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #08111f;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .page-shell {
        position: relative;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          #08111f 0%,
          #0b132b 35%,
          #111827 100%
        );
      }
      #sidebar-root {
        height: 100vh;
        overflow: hidden;
      }
      #sidebar-root > * {
        height: 100vh;
      }
      .content-section {
        margin-bottom: 2rem;
      }
      .section-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }
      .section-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }
      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
      }
      .soft-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        padding: 0.45rem 0.9rem;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #dbeafe;
      }
      .page-heading {
        margin-top: 0.9rem;
        font-size: clamp(2rem, 3vw, 2.8rem);
        font-weight: 700;
        letter-spacing: -0.055em;
        color: #f8fafc;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .animate-slide-in {
        animation: slideIn 0.3s ease-out;
      }
    </style>
    <script src="/static/shared.js"></script>
  </head>
  <body class="dark h-screen overflow-hidden">
    <div class="page-shell h-screen overflow-hidden">
      <div
        class="absolute inset-0 bg-gradient-to-br from-[#08111F] via-[#0B132B] to-[#111827]"
      ></div>
      <div class="absolute inset-0 opacity-75">
        <img
          src="/assets/hero_bg.png"
          alt="Background"
          class="h-full w-full object-cover object-center"
          loading="lazy"
        />
      </div>
      <div
        class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-950/45 to-transparent"
      ></div>
      <div
        class="relative z-10 flex h-screen max-w-full"
      >
        <div id="sidebar-root"></div>
        <main
          class="flex-1 h-screen overflow-y-auto"
        >
          <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="mb-6 flex items-center justify-between gap-3">
              <div>
                <div class="soft-badge mb-3">Projects</div>
                <h1 class="page-heading">Repository library</h1>
              </div>
            </div>
            <div
              id="projects-list"
              class="section-card text-sm text-slate-200"
            >
              Loading projects...
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      async function loadProjects() {
        try {
          const res = await APIClient.get("/api/projects");
          const el = document.getElementById("projects-list");
          
          if (!res || Object.keys(res).length === 0) {
            el.innerHTML = `
              <div class="flex flex-col items-center justify-center py-12 space-y-4">
                <div class="text-4xl">📁</div>
                <p class="text-slate-400">No projects yet</p>
                <a href="generate.html" class="text-indigo-400 hover:text-indigo-300 transition-colors">
                  Add your first project →
                </a>
              </div>
            `;
            return;
          }
          
          let html = '<ul class="space-y-3">';
          Object.keys(res).forEach((k, index) => {
            const p = res[k] || {};
            html += `
              <li class="p-4 bg-slate-800/30 rounded-xl border border-white/10 hover:border-white/20 transition-all duration-200 flex justify-between items-center animate-slide-in backdrop-blur-sm" style="animation-delay: ${index * 50}ms">
                <div class="flex-1">
                  <div class="font-semibold text-white">${k}</div>
                  <div class="text-xs text-slate-400 mt-1 break-all">${p.repo_url || ""}</div>
                </div>
                <div class="flex gap-2">
                  <button onclick="editProject('${k}')" class="px-3 py-1.5 bg-slate-800/50 hover:bg-slate-700/50 text-slate-300 hover:text-white border border-white/10 rounded-lg text-xs font-medium transition-all">Edit</button>
                  <button onclick="deleteProject('${k}')" class="px-3 py-1.5 bg-slate-800/50 hover:bg-slate-700/50 text-slate-300 hover:text-white border border-white/10 rounded-lg text-xs font-medium transition-all">Delete</button>
                </div>
              </li>
            `;
          });
          html += "</ul>";
          el.innerHTML = html;
        } catch (e) {
          document.getElementById("projects-list").innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 space-y-4">
              <div class="text-4xl">⚠️</div>
              <p class="text-slate-400">Failed to load projects</p>
              <button onclick="loadProjects()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors">
                Retry
              </button>
            </div>
          `;
          NotificationManager.show("Failed to load projects", "error");
        }
      }
      
      async function deleteProject(id) {
        if (!confirm("Delete project " + id + "?")) return;
        try {
          await APIClient.delete("/api/projects", { project_id: id });
          NotificationManager.show("Project deleted successfully", "success");
          loadProjects();
        } catch (e) {
          NotificationManager.show("Failed to delete project", "error");
        }
      }
      
      async function editProject(id) {
        try {
          const res = await APIClient.get("/api/projects");
          const p = res[id] || {};
          const newRepo = prompt(
            "Edit repository URL for " + id,
            p.repo_url || "",
          );
          if (newRepo === null) return;
          const title = prompt(
            "Title/label (optional)",
            (p.metadata && p.metadata.title) || "",
          );
          const metadata = { ...(p.metadata || {}) };
          if (title !== null) metadata.title = title;
          await APIClient.post("/api/projects", {
            project_id: id,
            repo_url: newRepo,
            metadata,
          });
          NotificationManager.show("Project updated successfully", "success");
          loadProjects();
        } catch (e) {
          NotificationManager.show("Failed to edit project", "error");
        }
      }
      
      loadProjects();
    </script>
    <script src="/static/sidebar-loader.js"></script>
  </body>
</html>
