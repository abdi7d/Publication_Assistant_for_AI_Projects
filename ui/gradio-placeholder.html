<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradio UI - Publication Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                navy: "#0f172a",
                sidebar: "#0b1120",
                card: "#1e293b",
                surface: "#111827",
                accent: "#6366f1",
                border: "#334155",
                muted: "#94a3b8",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #08111f;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        box-shadow: 0 28px 80px -45px rgba(15, 23, 42, 0.85);
      }
    </style>
  </head>
  <body class="dark h-screen overflow-hidden">
    <div class="relative h-screen overflow-hidden">
      <div
        class="absolute inset-0 bg-gradient-to-br from-[#08111F] via-[#0B132B] to-[#111827]"
      ></div>
      <div class="absolute inset-0 opacity-75">
        <img
          src="/assets/hero_bg.png"
          alt="Hero background illustration"
          class="h-full w-full object-cover object-center"
          loading="lazy"
        />
      </div>
      <div
        class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-950/45 to-transparent"
      ></div>
      
      <div class="relative z-10 flex h-screen flex-col items-center justify-center px-4">
        <div class="max-w-2xl w-full text-center space-y-8">
          <div class="space-y-4">
            <div
              class="inline-flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs uppercase tracking-[0.35em] text-slate-200"
            >
              <span
                class="inline-flex h-9 w-9 items-center justify-center rounded-2xl bg-gradient-to-br from-orange-500 to-pink-500 text-slate-950"
              >🚀</span
              >
              Gradio Interface
            </div>
            <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">
              Starting Gradio Server...
            </h1>
            <p class="text-slate-300">
              The Gradio interface is being initialized. This may take a few moments.
            </p>
          </div>

          <div class="glass-card rounded-3xl p-8">
            <div class="flex items-center justify-center space-x-4">
              <div class="animate-spin h-8 w-8 border-2 border-orange-500 border-t-transparent rounded-full"></div>
              <div class="text-left space-y-2">
                <p class="text-sm text-slate-300">Loading Gradio interface...</p>
                <p class="text-xs text-slate-500">Initializing machine learning components</p>
              </div>
            </div>
          </div>

          <div class="space-y-4">
            <a
              href="/web-ui"
              class="inline-flex items-center justify-center rounded-full border border-white/10 bg-white/5 px-6 py-3 text-sm font-semibold text-slate-200 transition hover:bg-white/10"
            >
              ← Back to Interface Selection
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Redirect to the actual Gradio launch endpoint
      setTimeout(() => {
        // This will eventually connect to the actual Gradio launch
        // For now, we'll redirect to the main app without --serve-ui flag
        window.location.href = '/'; 
      }, 3000);
    </script>
  </body>
</html>
