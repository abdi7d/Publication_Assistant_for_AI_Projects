<script>
  // Highlight current page in sidebar
  document.addEventListener('DOMContentLoaded', () => {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const navLinks = document.querySelectorAll('[data-nav]');
    
    navLinks.forEach(link => {
      const nav = link.getAttribute('data-nav');
      if (nav === currentPage.replace('.html', '') || 
          (currentPage === '' && nav === 'home') ||
          (currentPage === 'index.html' && nav === 'home')) {
        link.classList.add('bg-indigo-500/10', 'text-white');
        link.classList.remove('text-slate-300');
        link.querySelector('span').classList.add('bg-indigo-500/20', 'text-indigo-400');
        link.querySelector('span').classList.remove('bg-slate-800/50', 'text-slate-400');
      } else {
        link.classList.remove('bg-indigo-500/10', 'text-white');
        link.classList.add('text-slate-300');
        link.querySelector('span').classList.remove('bg-indigo-500/20', 'text-indigo-400');
        link.querySelector('span').classList.add('bg-slate-800/50', 'text-slate-400');
      }
    });
    
    // Initialize theme icon in sidebar
    if (typeof ThemeManager !== 'undefined') {
      ThemeManager.updateToggleIcons();
    }
  });
</script>
